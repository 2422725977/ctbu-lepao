name: build-capture-exe

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows exe
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mitmproxy pycryptodome requests

      - name: Generate mitmdump entry script
        shell: pwsh
        run: |
          @"
          from mitmproxy.tools.main import mitmdump
          mitmdump()
          "@ | Set-Content -Path _mitmdump_entry.py -Encoding utf8

      - name: Build mitmdump.exe
        run: pyinstaller --console --name mitmdump _mitmdump_entry.py

      - name: Build LePaoToken.exe
        run: pyinstaller --windowed --name LePaoToken --add-data "capture/token_addon.py;." capture/capture_gui.py

      - name: Package zip
        shell: pwsh
        run: |
          Copy-Item dist\mitmdump\mitmdump.exe dist\LePaoToken\
          Compress-Archive -Path dist\LePaoToken -DestinationPath LePaoToken-win64.zip
          Get-Item LePaoToken-win64.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LePaoToken-win64
          path: LePaoToken-win64.zip
          if-no-files-found: error
