name: build-capture-exe

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows exe
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mitmproxy pycryptodome requests

      - name: Build LePaoToken.exe (单文件，内置 mitmproxy)
        run: pyinstaller --onefile --windowed --name LePaoToken capture/capture_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LePaoToken-win64
          path: dist\LePaoToken.exe
          if-no-files-found: error
