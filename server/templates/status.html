<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乐跑多账号管理</title>
<style>
body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f23; color: #eee; padding: 2em; }
h1 { color: #7c4dff; } table { border-collapse: collapse; width: 100%; margin: 1em 0; }
td, th { border: 1px solid #333; padding: 10px 14px; text-align: left; }
th { background: #16213e; color: #7c4dff; } tr:hover { background: #1a1a3e; }
.ok { color: #4caf50; } .warn { color: #ff9800; } .err { color: #f44336; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.85em; }
.badge-ok { background: #1b5e20; color: #a5d6a7; }
.badge-dead { background: #b71c1c; color: #ef9a9a; }
.refresh-info { color: #888; font-size: 0.85em; }
</style>
</head>
<body>
<h1>🏃 乐跑多账号管理</h1>
<p>服务器时间: {{ now }} | 账号数: {{ accounts|length }}</p>
<table>
<tr><th>学号</th><th>姓名</th><th>Token</th><th>签发时间</th><th>状态</th></tr>
{% for acc in accounts %}
<tr>
  <td>{{ acc.student_num }}</td>
  <td>{{ acc.alias }}</td>
  <td>{{ acc.auth.token[:8] }}…</td>
  <td>{{ acc.auth.issued_at }}</td>
  <td><span class="badge-ok">✓ 有效</span></td>
</tr>
{% endfor %}
</table>
<p class="refresh-info">刷新时间: {{ now }} · 自动刷新: <span id="countdown">60</span>s</p>
<script>let c=60;setInterval(()=>{c--;document.getElementById("countdown").textContent=c;if(c<=0)location.reload()},1000)</script>
</body></html>
