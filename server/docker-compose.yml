version: "3.8"

services:
  lepao-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: ctbu-lepao
    restart: unless-stopped
    ports:
      # 监听局域网：允许登录器客户端跨机上传 token（有 X-LP-Key 口令保护）
      - "8080:8080"
    volumes:
      - ./data/accounts.json:/app/data/accounts.json
      - ./data/logs:/app/data/logs
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      # 置 0 可只起 API 不起后台调度器（调试用）
      - LEPAO_SCHEDULER=1
      # 抓号上传口令（登录器内置同款，防止局域网内他人乱塞 token）
      - LEPAO_UPLOAD_KEY=05a0a68a53f2128c
      # 邮件通知：填 QQ 邮箱 SMTP 授权码后启用（收件人留空=发给自己）
      - LEPAO_SMTP_USER=tokenai@foxmail.com
      - LEPAO_SMTP_PASS=wjehuozblepadgae
      - LEPAO_MAIL_TO=bug2@foxmail.com
      # 企业微信通知不走容器内代码（安全约束：容器零外呼）。
      # 由宿主机 cron 监控容器日志并转发，示例（crontab -e 添加一行）：
      # */5 * * * * docker logs ctbu-lepao --since 5m 2>&1 | grep -E "成功|TOKEN_DEAD" | while read l; do curl -s "你的机器人webhook地址" -H 'Content-Type: application/json' -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$l\"}}" > /dev/null; done
