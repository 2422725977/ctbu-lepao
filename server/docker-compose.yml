version: "3.8"

services:
  lepao-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: ctbu-lepao
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data/accounts.json:/app/data/accounts.json
      - ./data/state:/app/data/state
      - ./data/logs:/app/data/logs
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
