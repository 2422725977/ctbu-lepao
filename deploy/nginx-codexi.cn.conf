# =====================================================================
# CTBU 乐跑主页管理系统 · codexi.cn / www.codexi.cn 反代站点
# 交付文件：deploy/nginx-codexi.cn.conf（由 deploy/deploy.sh 安装，勿手工改名）
#
# 【安装位置】/www/server/panel/vhost/nginx/codexi.cn.conf
# 【生效方式】宝塔主配置 /www/server/nginx/conf/nginx.conf 第 99 行：
#     include /www/server/panel/vhost/nginx/*.conf;      ← 位于 http {} 块内
#   拷贝本文件到上述目录后执行：
#     nginx -t && nginx -s reload        # 宝塔环境若 nginx 不在 PATH，用 /www/server/nginx/sbin/nginx
#
# 【两条硬规矩】
#   1. 不要改 nginx.conf 主配置，本文件靠通配 include 自动生效；
#   2. 不要与宝塔面板创建的同名站点共存：面板会另生成一份 *.conf 并声明
#      server_name codexi.cn，Nginx 会报 "conflicting server name" 且由先加载者命中。
#      若面板里已有 codexi.cn 站点，请先在面板停用/删除该站点，再装本文件。
#
# 【网络】公网 80 → 本 server → 127.0.0.1:8080（容器内 Flask，compose 只绑回环）
#   8080 不监听 0.0.0.0，禁止公网直连；域名不出现在任何业务代码中。
# 【状态】codexi.cn 尚未完成 ICP 备案，大陆节点按域名访问 80/443 会被拦截；
#   因此只启用 80，验证一律用 curl -H 'Host: codexi.cn' http://127.0.0.1/。
#   443 / HTTPS 的 server 块在文件末尾以注释形式预留，当前未启用、未引用证书。
# =====================================================================

server {
    listen 80;
    # 不加 default_server：宝塔 80 上还有 phpmyadmin / 默认站点，避免抢默认。
    server_name codexi.cn www.codexi.cn;

    client_max_body_size 2m;          # /api/token 只收小 JSON，限住请求体
    server_tokens off;

    access_log /www/wwwlogs/codexi.cn.log;
    error_log  /www/wwwlogs/codexi.cn.error.log warn;

    # gzip：反代响应同样压缩（gzip_proxied any 必须开，否则 proxied 响应不压）
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               application/xml text/javascript image/svg+xml;

    # 安全头（server 级）。后端 after_request 也会下发同名头，先隐藏上游头避免重复。
    # 注意 Nginx add_header 继承规则：子 location 一旦自己声明 add_header，就不再
    # 继承本级的头；因此 location /static/ 内必须再声明一份，见下方。
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 公共反代头（server 级，下面所有 location 继承） ----
    # 后端 ProxyFix(x_for=1, x_proto=1, x_host=1) 只信任 1 层：
    #   X-Forwarded-For 用 $proxy_add_x_forwarded_for 追加真实 IP，ProxyFix 取最右值，
    #   客户端自带伪造的 XFF 不会生效；不要再叠加 CDN / 二级反代，否则需同步调信任层数。
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;     # 当前 http；备案启用 443 后自动为 https
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";   # 本项目无 WebSocket，Upgrade 两行为将来预留
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ---- 写接口加固片段（注释状态，默认不启用） ----
    # 背景：POST /api/token、POST /api/submit/<student_num> 是无鉴权写接口，
    #       经本反代后公网可直调。下面是 403 拦截，是否启用由主理人决策。
    # 启用方式：整段取消注释（含 location 块）；正则 location 优先于 location /，
    #           放在 server 内任意位置均可，建议紧随公共反代头之后。
    # 效果：/api/token 与 /api/submit/ 的非 GET/HEAD 请求一律 403。
    # 代价：抓号客户端也无法从公网推送 token，需改走服务器本机 127.0.0.1:8080 或内网。
    # 启用后记得 nginx -t && nginx -s reload。
    # location ~ ^/api/(token|submit/) {
    #     if ($request_method !~ ^(GET|HEAD)$) {
    #         return 403;
    #     }
    #     proxy_pass http://127.0.0.1:8080;
    # }

    # ---- 静态资源：反代到 Flask（文件名无内容 hash，7 天缓存，不用 immutable） ----
    # 后端 after_request 已删除 /static/ 的 Cache-Control，缓存策略完全交给 Nginx。
    # expires 7d 会自动写 Expires + Cache-Control: max-age=604800；下面 add_header
    # 再给一份 public, max-age=604800，浏览器按逗号合并后语义等价（两个同名头无害）。
    # 若要绝对单头，删掉 add_header 只留 expires；改前端后记得强刷或改文件名，
    # 否则 7 天内浏览器仍命中旧 CSS/JS。
    location /static/ {
        proxy_pass http://127.0.0.1:8080;          # 不带尾斜杠，原样传 /static/xxx
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # 本级有 add_header → 不继承 server 级安全头，必须重复声明
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}

